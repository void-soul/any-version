name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # 锁文件漂移设防：与本地 lockfile 不一致时直接失败。
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # 依赖漏洞扫描：生产依赖存在 high/critical 漏洞时阻断。
      - name: pnpm audit (production)
        run: pnpm audit --prod --audit-level=high

  backend:
    # AnyVersion 是 Windows-only 应用（基于 WebView2），在 Windows runner 上编译检查
    # 才反映真实产物环境，且 Windows runner 自带 WebView2 / Windows SDK，无需额外安装。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # 硬性关卡：编译必须通过（抓真正的编译/类型错误）。
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      # 硬性关卡：单元测试必须通过。
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # 软性检查：clippy / fmt 仅报告不阻断 CI（应用项目不过度追求零 lint warning）。
      - name: cargo clippy (report only)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -W warnings
        continue-on-error: true
      - name: cargo fmt (report only)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        continue-on-error: true

