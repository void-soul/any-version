[package]
name = "cert-deployment"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Shared transactional certificate deployment and bounded reload commands"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
fs2 = "0.4.3"
getrandom = "0.2"
