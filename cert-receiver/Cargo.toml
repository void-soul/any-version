[package]
name = "cert-receiver"
version = "0.2.0"
edition = "2021"
# 工具链与主应用一致（1.88）。resolver = "3" 让 cargo 按 MSRV 选版本，
# 否则 tauri 2.12 / muda 0.20 这些要求 1.90 的新版会被拉进来直接编译失败。
rust-version = "1.88.0"
resolver = "3"
description = "AnyVersion 证书管理 - Windows 接收端（托盘小工具：可视化配置 + 实时日志）"

[[bin]]
name = "cert-receiver"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 托盘窗口：界面用静态 HTML/JS（无前端构建链），资源由 tauri 直接嵌进 exe
tauri = { version = "2", features = ["tray-icon", "image-png"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
md5 = "0.7"
# 输出目录选择（原生文件夹对话框；不用 dialog 插件，免得为了它引入 npm 侧依赖）
rfd = "0.16"
chrono = "0.4"
getrandom = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
