<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vex 开发助理</title>
    <script>
      // anti-FOUC：首屏绘制前先把根背景设为深色，避免 WebView2 原生层白闪（移植自 cc-switch #6252）
      (function () {
        try {
          document.documentElement.style.background = "#0d111d";
          document.documentElement.style.colorScheme = "dark";
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
